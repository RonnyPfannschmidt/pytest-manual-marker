name: "python tests+artifacts+release"

on:
  pull_request:
  push:
    branches:
    - main
    tags:
    - "v*"

jobs:
  dist:
    runs-on: ubuntu-latest
    name: Python sdist/wheel
    steps:
    - uses: actions/checkout@v7
      with:
        # hatch-vcs derives the version from tags
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10.3.0
    - run: uv build
    - run: uvx twine check --strict dist/*
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist

  test:
    runs-on: ubuntu-latest
    needs: [dist]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        pytest: ["pytest==8.0.*", "pytest"]
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.0
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist
    - name: pytest (${{ matrix.python-version }}, ${{ matrix.pytest }})
      run: >-
        uv run --isolated --no-project
        --python ${{ matrix.python-version }}
        --with dist/*.whl --with "${{ matrix.pytest }}"
        pytest

  dist_upload:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags') }}
    needs: [test]
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist
    - uses: pypa/gh-action-pypi-publish@release/v1
