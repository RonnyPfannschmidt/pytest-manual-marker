[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs",
  "hatchling>=1.27",
]

[project]
name = "pytest-manual-marker"
description = "pytest marker for marking manual tests"
readme = "README.md"
keywords = [
  "manual",
  "py.test",
  "pytest",
  "testing",
]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
  { name = "Ronny Pfannschmidt", email = "opensource@ronnypfannschmidt.de" },
  { name = "Martin Kourim", email = "mkourim@redhat.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Testing",
]
dynamic = [
  "version",
]
dependencies = [
  "pytest>=8",
]
urls.Homepage = "https://github.com/RonnyPfannschmidt/pytest-manual-marker"
entry-points.pytest11.manual_marker = "pytest_manual_marker"

[dependency-groups]
dev = [
  "pytest",
  "regendoc>=0.9",
]

[tool.hatch]
version.source = "vcs"
build.targets.sdist.include = [
  "/src",
]

[tool.ruff]
lint.extend-select = [ "B", "I", "UP" ]
lint.isort.force-single-line = true
