[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs",
  "hatchling>=1.27",
]

[project]
name = "pytest-manual-marker"
description = "pytest marker for marking manual tests"
readme = "README.md"
keywords = [
  "manual",
  "py.test",
  "pytest",
  "testing",
]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
    { name = "Ronny Pfannschmidt", email = "opensource@ronnypfannschmidt.de"},
    { name = "Martin Kourim",  email="mkourim@redhat.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dynamic = [
  "version",
]
dependencies = [
  "pytest>=8",
]
[project.urls]
Homepage = "https://github.com/RonnyPfannschmidt/pytest-manual-marker"
[project.entry-points.pytest11]
manual_marker = "pytest_manual_marker"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]
